worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    map $upstream_addr $backend_name {
        "10.7.11.131:3001" A;
        "10.7.11.144:3002" B;
    }

    log_format team1 '$remote_addr "$request" $status upstream=$upstream_addr '
                     'upstream_status=$upstream_status rt=$request_time';

    access_log /opt/homebrew/var/log/nginx/access.log team1;

    upstream app_backend {
        server 10.7.11.131:3001 max_fails=1 fail_timeout=10s;
        server 10.7.11.144:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        server_name 10.7.11.131;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;

        server_name app.noaa.test api.noaa.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Edge standby always;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
